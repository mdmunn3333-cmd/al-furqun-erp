<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Al Furqun ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login">
  <div class="login-box">
    <div class="logo">AF</div>
    <h1>Al Furqun</h1><p>Complete Reselling ERP</p>
    <form id="loginForm">
      <label>Username</label><input id="username" value="admin" required>
      <label>Password</label><input id="password" type="password" value="1234" required>
      <button class="btn primary wide">Log In</button>
    </form>
    <small>Demo login: admin / 1234</small>
  </div>
</div>

<div id="app" class="hidden">
<aside id="sidebar">
  <div class="brand"><div class="logo sm">AF</div><div><b>Al Furqun</b><small>Reselling ERP</small></div></div>
  <nav>
    <button data-page="dashboard" class="active">▦ <span>Dashboard</span></button>
    <button data-page="orders">▤ <span>Orders</span></button>
    <button data-page="customers">♙ <span>Customers</span></button>
    <button data-page="products">◈ <span>Products</span></button>
    <button data-page="suppliers">♜ <span>Suppliers</span></button>
    <button data-page="expenses">− <span>Expenses</span></button>
    <button data-page="accounts">৳ <span>Accounts</span></button>
    <button data-page="reports">▥ <span>Reports</span></button>
    <button data-page="settings">⚙ <span>Settings</span></button>
  </nav>
  <button id="logout" class="logout">↪ Log Out</button>
</aside>

<main>
<header>
  <button id="menu" class="mobile">☰</button>
  <div class="search"><span>⌕</span><input id="search" placeholder="Search anything..."></div>
  <div class="user"><span class="avatar">A</span><span>Admin</span></div>
</header>
<section id="content"></section>
</main>
</div>

<div id="modal"></div><div id="toast"></div>
<script src="script.js"></script>
</body>
</html>
